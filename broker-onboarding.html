<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="JS/gka-route-guard.js"></script>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <link rel="apple-touch-icon" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <title>Broker Verification Onboarding — GharKaAdda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>
    :root {
      --bg:#f7f3ee;
      --paper:#fffaf4;
      --accent:#7a4e2d;
      --accent-dark:#3d2516;
      --text:#1c1713;
      --muted:#77695f;
      --line:rgba(122,78,45,.16);
      --shadow:0 34px 100px rgba(63,39,24,.16);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height:100vh;
      font-family:Inter,sans-serif;
      color:var(--text);
      overflow-x:hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(122,78,45,.16), transparent 30%),
        radial-gradient(circle at 88% 20%, rgba(122,78,45,.12), transparent 28%),
        linear-gradient(135deg,var(--bg),#fff8ef);
    }

    a { color:inherit; text-decoration:none; }
    button { font:inherit; border:0; cursor:pointer; }

    .noise {
      position:fixed;
      inset:0;
      z-index:20;
      opacity:.12;
      pointer-events:none;
      background:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.2'/%3E%3C/svg%3E");
    }

    .page {
      position:relative;
      z-index:2;
      width:min(1180px, calc(100% - 42px));
      min-height:100vh;
      margin:0 auto;
      padding:42px 0;
      display:grid;
      align-items:center;
    }

    .top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:42px;
    }

    .brand img {
      width:150px;
    }

    .logout {
      min-height:46px;
      padding:0 18px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.58);
      backdrop-filter:blur(20px);
      color:var(--accent);
      font-weight:900;
      transition:.3s;
    }

    .logout:hover { transform:translateY(-3px); background:rgba(255,255,255,.8); }

    .split {
      display:grid;
      grid-template-columns:1fr 1.1fr;
      gap:48px;
      align-items:center;
    }

    .left-intro h1 {
      font-family:Manrope,sans-serif;
      font-size:clamp(44px,6.8vw,80px);
      line-height:.96;
      letter-spacing:-.06em;
      font-weight:800;
    }

    .left-intro h1 em { display:block; color:var(--accent); font-style:normal; }

    .left-intro p {
      max-width:520px;
      margin-top:24px;
      color:var(--muted);
      font-size:17px;
      line-height:1.75;
      font-weight:650;
    }

    .form-card {
      padding:34px;
      border:1px solid var(--line);
      border-radius:38px;
      background:rgba(255,255,255,.76);
      backdrop-filter:blur(28px);
      box-shadow:var(--shadow);
    }

    .form-card h2 { font-family:Manrope,sans-serif; color:var(--accent); font-size:32px; font-weight:800; margin-bottom:12px; }
    .form-card p { color:var(--muted); font-size:14px; font-weight:650; margin-bottom:28px; }

    .form-grp {
      margin-bottom:18px;
      text-align:left;
    }

    .form-grp label {
      display:block;
      font-size:13px;
      font-weight:800;
      color:var(--muted);
      margin-bottom:6px;
    }

    .form-grp input, .form-grp select, .form-grp textarea {
      width:100%;
      height:48px;
      padding:0 14px;
      border-radius:12px;
      border:1px solid rgba(122,78,45,.2);
      outline:none;
      font-weight:750;
      color:var(--text);
    }

    .form-grp textarea { height:90px; padding:12px; resize:none; }

    .form-grp input:focus, .form-grp select:focus, .form-grp textarea:focus {
      border-color:var(--accent);
    }

    .file-input-box {
      width:100%;
      min-height:110px;
      border:2px dashed rgba(122,78,45,.24);
      border-radius:18px;
      background:rgba(122,78,45,.04);
      display:grid;
      place-items:center;
      cursor:pointer;
      padding:20px;
      margin-bottom:20px;
      transition:.2s;
    }

    .file-input-box:hover {
      background:rgba(122,78,45,.08);
      border-color:var(--accent);
    }

    .file-input-box i { font-size:28px; color:var(--accent); }
    .file-input-box span { font-size:13px; font-weight:850; color:var(--accent-dark); margin-top:8px; }

    .submit-btn {
      width:100%;
      min-height:56px;
      margin-top:24px;
      border-radius:16px;
      background:var(--accent);
      color:white;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      box-shadow:0 18px 45px rgba(122,78,45,.24);
      transition:.25s;
    }

    .submit-btn:hover {
      transform:translateY(-2px);
      box-shadow:0 24px 54px rgba(122,78,45,.3);
    }

    .toast {
      position:fixed;
      left:50%;
      bottom:24px;
      z-index:900;
      padding:14px 18px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(18px);
      color:var(--accent);
      font-weight:900;
      box-shadow:0 18px 60px rgba(63,39,24,.15);
      transform:translate(-50%, 80px);
      opacity:0;
      transition:.35s;
    }

    .toast.show {
      transform:translate(-50%,0);
      opacity:1;
    }

    @media (max-width:980px) {
      .split { grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <div class="noise"></div>

  <main class="page">
    <div>
      <div class="top">
        <a href="index.html" class="brand">
          <img src="https://i.postimg.cc/pV527RJK/logo.png" alt="GharKaAdda">
        </a>

        <button class="logout" id="logoutBtn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          Logout
        </button>
      </div>

      <div class="split">
        <div class="left-intro">
          <h1>Verify your <em>Brokerage Profile.</em></h1>
          <p>
            Submit your professional certifications in seconds. Our admin audits credential transcripts manually inside 24 hours to preserve platform hygiene.
          </p>
        </div>

        <form class="form-card" id="brokerForm">
          <h2>Agent Qualifications</h2>
          <p>Add verification documents and licensing credentials.</p>

          <div class="form-grp">
            <label for="agencyName">Registered Agency Name</label>
            <input type="text" id="agencyName" placeholder="e.g. Metro Line Real Estate Group" required>
          </div>

          <div class="form-grp">
            <label for="reraCode">Government RERA Registration Number</label>
            <input type="text" id="reraCode" placeholder="e.g. HR-RERA-254A/2026" required>
          </div>

          <div class="form-grp">
            <label for="certUrl">Licensing Document / Certificate URL</label>
            <input type="url" id="certUrl" placeholder="https://drive.google.com/.../rera-cert.pdf" required>
          </div>

          <div class="form-grp">
            <label for="agentBio">Broker bio / Operation localities</label>
            <textarea id="agentBio" placeholder="Provide operational localities (e.g. operational in Delhi North, Rohini, Kingsway Camp)."></textarea>
          </div>

          <button class="submit-btn" type="submit">
            <span>Submit Verification request</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">Connecting broker portal...</div>

  <script src="config.js?v=2"></script>
  <script>
    const API_BASE_URL = window.GKA_CONFIG?.API_BASE_URL || "/api";
    const toast = document.getElementById("toast");
    let currentUser = null;
    let token = null;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2600);
    }

    async function checkAuth() {
      token = localStorage.getItem("gka_token") || localStorage.getItem("gka_auth_token");
      const userStr = localStorage.getItem("gka_user");
      
      if (!token || !userStr) {
        window.location.href = "login.html";
        return;
      }

      try {
        currentUser = JSON.parse(userStr);
      } catch (_) {
        window.location.href = "login.html";
        return;
      }
    }

    document.getElementById("brokerForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const agency = document.getElementById("agencyName").value.trim();
      const Rera = document.getElementById("reraCode").value.trim();
      const cert = document.getElementById("certUrl").value.trim();
      const bio = document.getElementById("agentBio").value.trim();

      showToast("Publishing verification details...");

      try {
        const res = await fetch(`${API_BASE_URL}/broker/onboard`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            agencyName: agency,
            reraRegisterCode: Rera,
            licensingDocUrl: cert,
            agentBio: bio
          })
        });

        const data = await res.json();

        if (!res.ok) {
          showToast(data.error || "Failed to submit verification request");
          return;
        }

        // Save updated user stepped role
        let freshUser = data.user;
        try {
          const meRes = await fetch(`${API_BASE_URL}/auth/me`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (meRes.ok) {
            const meData = await meRes.json();
            if (meData.user) freshUser = meData.user;
          }
        } catch (_) {}
        if (freshUser) {
          localStorage.setItem("gka_user", JSON.stringify(freshUser));
        }

        showToast("Verification submitted. Opening broker dashboard...");

        setTimeout(() => {
          window.location.href = "broker-dashboard.html";
        }, 700);
      } catch (err) {
        console.error("Broker onboard submit error:", err);
        showToast("Error processing verification submission.");
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      if (token) {
        try {
          await fetch(`${API_BASE_URL}/auth/logout`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` }
          });
        } catch (_) {}
      }
      localStorage.removeItem("gka_token");
      localStorage.removeItem("gka_auth_token");
      localStorage.removeItem("gka_user");
      window.location.href = "login.html";
    });

    checkAuth();
  </script>
</body>
</html>
