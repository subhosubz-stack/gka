<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="JS/gka-route-guard.js"></script>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <link rel="apple-touch-icon" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <title>Student Tiffin — GharKaAdda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="CSS/gka-app.css?v=2">
  <link rel="stylesheet" href="CSS/gka-dashboard-nav.css?v=1">
  <link rel="stylesheet" href="CSS/gka-shell.css?v=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: Inter, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 18%, rgba(122,78,45,.16), transparent 30%),
        radial-gradient(circle at 88% 20%, rgba(122,78,45,.12), transparent 28%),
        linear-gradient(135deg, var(--bg), #fff8ef);
    }
    a { color: inherit; text-decoration: none; }
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .brand img { width: 140px; }
    .back-btn {
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.6);
      font-weight: 800;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .plan-pill {
      display: inline-block;
      margin: 4px 6px 0 0;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(122,78,45,.1);
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 900;
      padding: 14px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,.85);
      border: 1px solid var(--line);
      color: var(--accent);
      font-weight: 900;
      transform: translate(-50%, 80px);
      opacity: 0;
      transition: 0.35s;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
  </style>
</head>
<body>
  <div class="gka-noise"></div>

  <main class="gka-page">
    <div class="top-nav">
      <a href="index.html" class="brand">
        <img src="https://i.postimg.cc/pV527RJK/logo.png" alt="GharKaAdda">
      </a>
      <div class="gka-shell-slot" data-auto></div>
    </div>

    <nav data-gka-dash-nav></nav>

    <section class="tiffin-hero">
      <h1 class="gka-title">Fuel your semester with <em style="font-style:normal;color:var(--accent-dark);">verified tiffin partners</em></h1>
      <p class="gka-sub" style="max-width:640px;margin:12px auto 0;">
        Homely meals near campus. Opt in once — we track commission for partners and keep your housing journey in one place.
      </p>
    </section>

    <div class="tiffin-grid" id="providerCards"></div>

    <div class="gka-glass tiffin-form-panel" id="optInPanel">
      <h2 class="gka-title" style="font-size:26px;">Choose your meal plan</h2>
      <p class="gka-sub">Select provider and plan — billed monthly with your rent.</p>

      <div class="lw-row" style="margin-top:20px;">
        <div class="lw-field">
          <label>Provider</label>
          <select id="providerSelect"></select>
        </div>
        <div class="lw-field">
          <label>Plan</label>
          <select id="planSelect"></select>
        </div>
      </div>
      <div class="lw-field">
        <label>Monthly deal value (₹)</label>
        <input type="number" id="dealValue" value="2500" min="0" />
      </div>
      <button type="button" class="gka-btn gka-btn-primary" id="optInBtn" style="width:100%;margin-top:8px;">
        <i class="fa-solid fa-utensils"></i> Opt in to plan
      </button>
      <p id="optMsg" class="gka-sub" style="margin-top:14px;text-align:center;"></p>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="config.js?v=2"></script>
  <script src="JS/gka-notifications.js?v=1"></script>
  <script src="JS/gka-dashboard-nav.js?v=1"></script>
  <script src="JS/gka-shell.js?v=1"></script>
  <script>
    const API = window.GKA_CONFIG?.API_BASE_URL || "/api";
    const token = localStorage.getItem("gka_token") || localStorage.getItem("gka_auth_token");
    const toast = document.getElementById("toast");
    if (!token) location.href = "login.html";

    function showToast(m) {
      toast.textContent = m;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2600);
    }

    let providers = [];

    async function loadProviders() {
      const res = await fetch(`${API}/tiffin/providers`);
      const data = await res.json();
      providers = data.providers || [];
      const grid = document.getElementById("providerCards");
      const sel = document.getElementById("providerSelect");
      const planSel = document.getElementById("planSelect");

      grid.innerHTML = providers
        .map(
          (p, i) => `
        <article class="tiffin-card" data-idx="${i}">
          <div class="icon-ring"><i class="fa-solid fa-bowl-food"></i></div>
          <h3 style="font-family:Manrope,sans-serif;font-size:22px;font-weight:800;color:var(--accent);">${p.name}</h3>
          <p class="gka-sub" style="margin-top:8px;">${p.plans.map((pl) => `<span class="plan-pill">${pl}</span>`).join("")}</p>
        </article>`
        )
        .join("");

      sel.innerHTML = providers.map((p) => `<option>${p.name}</option>`).join("");
      function syncPlans() {
        const p = providers.find((x) => x.name === sel.value);
        planSel.innerHTML = (p?.plans || []).map((pl) => `<option>${pl}</option>`).join("");
      }
      sel.onchange = syncPlans;
      syncPlans();

      grid.querySelectorAll(".tiffin-card").forEach((card) => {
        card.addEventListener("click", () => {
          const p = providers[parseInt(card.dataset.idx, 10)];
          sel.value = p.name;
          syncPlans();
          document.getElementById("optInPanel").scrollIntoView({ behavior: "smooth" });
        });
      });

      if (window.gsap) {
        gsap.from(".tiffin-card", { opacity: 0, y: 36, stagger: 0.12, duration: 0.6, ease: "power3.out" });
        gsap.from("#optInPanel", { opacity: 0, y: 24, delay: 0.35, duration: 0.55 });
      }
    }

    document.getElementById("optInBtn").onclick = async () => {
      showToast("Recording your opt-in...");
      const res = await fetch(`${API}/tiffin/opt-in`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({
          provider_name: document.getElementById("providerSelect").value,
          plan_name: document.getElementById("planSelect").value,
          deal_value: document.getElementById("dealValue").value
        })
      });
      const data = await res.json();
      document.getElementById("optMsg").textContent = res.ok
        ? `You're in! Estimated platform commission: ₹${data.commissionValue}`
        : data.error || "Failed";
      if (res.ok) showToast("Tiffin plan activated");
    };

    loadProviders();
  </script>
</body>
</html>
