<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="JS/gka-route-guard.js"></script>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <link rel="apple-touch-icon" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <title>Broker Dashboard — GharKaAdda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>
    :root {
      --bg:#f7f3ee;
      --paper:#fffaf4;
      --accent:#7a4e2d;
      --accent-dark:#3d2516;
      --text:#1c1713;
      --muted:#77695f;
      --line:rgba(122,78,45,.16);
      --shadow:0 34px 100px rgba(63,39,24,.16);
      --success:#17803d;
      --premium-glow:rgba(212,175,55,.68);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height:100vh;
      font-family:Inter,sans-serif;
      color:var(--text);
      overflow-x:hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(122,78,45,.16), transparent 30%),
        radial-gradient(circle at 88% 20%, rgba(122,78,45,.12), transparent 28%),
        linear-gradient(135deg,var(--bg),#fff8ef);
    }

    a { color:inherit; text-decoration:none; }
    button { font:inherit; border:0; cursor:pointer; }

    .noise {
      position:fixed;
      inset:0;
      z-index:20;
      opacity:.12;
      pointer-events:none;
      background:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.2'/%3E%3C/svg%3E");
    }

    .page {
      position:relative;
      z-index:2;
      width:min(1180px, calc(100% - 42px));
      min-height:100vh;
      margin:0 auto;
      padding:42px 0;
    }

    .top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:42px;
    }

    .brand img {
      width:150px;
    }

    .top-right {
      display:flex;
      align-items:center;
      gap:12px;
    }

    .top-btn {
      min-height:46px;
      padding:0 18px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.58);
      backdrop-filter:blur(20px);
      color:var(--accent);
      font-weight:900;
      transition:.3s;
      display:inline-flex;
      align-items:center;
      gap:10px;
    }

    .top-btn:hover { transform:translateY(-3px); background:rgba(255,255,255,.8); }

    .stream-block {
      padding:34px;
      border:1px solid var(--line);
      border-radius:34px;
      background:rgba(255,255,255,.68);
      backdrop-filter:blur(24px);
      box-shadow:var(--shadow);
      margin-bottom:34px;
      width:100%;
    }

    .stream-block h2 { font-family:Manrope,sans-serif; color:var(--accent); font-size:30px; font-weight:800; margin-bottom:18px; }

    .listings-row {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:20px;
    }

    .p-card {
      border:1px solid var(--line);
      border-radius:24px;
      background:rgba(255,255,255,.5);
      overflow:hidden;
      display:grid;
      grid-template-columns:120px 1fr;
    }

    .p-img {
      background-size:cover;
      background-position:center;
      background-color:rgba(122,78,45,.08);
    }

    .p-body {
      padding:18px;
      text-align:left;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .p-body h4 { font-family:Manrope,sans-serif; font-size:16.5px; font-weight:800; }
    .p-body p { color:var(--muted); font-size:12.5px; margin-top:4px; }

    .p-meta { display:flex; gap:10px; font-size:11.5px; font-weight:750; color:var(--muted); margin-top:8px; }
    .p-meta span i { color:var(--accent); margin-right:4px; }

    .badge-status {
      align-self:start;
      margin-top:6px;
      padding:3px 10px;
      border-radius:99px;
      font-size:11px;
      font-weight:900;
      text-transform:uppercase;
    }

    .badge-status.vacant { background:rgba(23,128,61,.08); color:var(--success); }
    .badge-status.locked { background:rgba(122,78,45,.08); color:var(--accent); }

    .stats-row {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
      margin-bottom:34px;
    }

    .stat-card {
      padding:24px;
      border:1px solid var(--line);
      border-radius:24px;
      background:rgba(255,255,255,.62);
      text-align:center;
    }

    .stat-card strong { display:block; font-family:Manrope,sans-serif; font-size:38px; font-weight:800; color:var(--accent); }
    .stat-card span { font-size:12.5px; color:var(--muted); font-weight:800; }

    .lock-request-block {
      border-top:1px solid var(--line);
      margin-top:14px;
      padding-top:14px;
      font-size:12px;
      color:var(--muted);
      font-weight:750;
    }

    .toast {
      position:fixed;
      left:50%;
      bottom:24px;
      z-index:900;
      padding:14px 18px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(18px);
      color:var(--accent);
      font-weight:900;
      box-shadow:0 18px 60px rgba(63,39,24,.15);
      transform:translate(-50%, 80px);
      opacity:0;
      transition:.35s;
    }

    .toast.show {
      transform:translate(-50%,0);
      opacity:1;
    }

    @media (max-width:900px) {
      .listings-row { grid-template-columns:1fr; }
      .stats-row { grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <div class="noise"></div>

  <main class="page">
    <div class="top">
      <a href="index.html" class="brand">
        <img src="https://i.postimg.cc/pV527RJK/logo.png" alt="GharKaAdda">
      </a>

      <div class="top-right">
        <div class="gka-shell-slot" data-auto></div>
        <a href="owner-onboarding.html" class="top-btn">
          <i class="fa-solid fa-plus"></i> List Property
        </a>

        <button class="top-btn" id="logoutBtn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>

    <nav data-gka-dash-nav></nav>

    <!-- Broker Stats Section -->
    <section class="stats-row">
      <div class="stat-card">
        <strong id="totalL">0</strong>
        <span>Listed Properties</span>
      </div>
      <div class="stat-card">
        <strong id="premiumL">0</strong>
        <span>Premium Listings</span>
      </div>
      <div class="stat-card">
        <strong id="stMatchL">100%</strong>
        <span>Client Match Quality</span>
      </div>
    </section>

    <!-- Listings Managed Section -->
    <div class="stream-block">
      <h2>Properties Managed by You</h2>
      <div class="listings-row" id="listingsContainer">
        <p style="color:var(--muted);font-weight:600;font-size:15px;text-align:center;padding:34px 0;">Loading publications stream...</p>
      </div>
    </div>

    <div class="stream-block" id="brokerChatInbox">
      <h2>Property chats</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Platform help: <a href="support.html" style="color:var(--accent);font-weight:800;">Contact support</a></p>
      <div id="brokerChatHost"></div>
    </div>
  </main>

  <div class="toast" id="toast">Connecting secure streams...</div>

  <link rel="stylesheet" href="CSS/gka-dashboard-nav.css?v=1" />
  <link rel="stylesheet" href="CSS/gka-price-display.css?v=1" />
  <link rel="stylesheet" href="CSS/gka-shell.css?v=1" />
  <script src="config.js?v=2"></script>
  <script src="JS/gka-profile-badge.js?v=1"></script>
  <script src="JS/gka-notifications.js?v=1"></script>
  <script src="JS/gka-price-display.js?v=1"></script>
  <script src="JS/gka-dashboard-nav.js?v=1"></script>
  <script src="JS/gka-shell.js?v=3"></script>
  <link rel="stylesheet" href="CSS/gka-chat-olx.css?v=2" />
  <script src="JS/gka-chat.js?v=7"></script>
  <script>
    const API_BASE_URL = window.GKA_CONFIG?.API_BASE_URL || "/api";
    const toast = document.getElementById("toast");
    let currentUser = null;
    let token = null;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2600);
    }

    async function checkAuth() {
      token = localStorage.getItem("gka_token") || localStorage.getItem("gka_auth_token");
      const userStr = localStorage.getItem("gka_user");
      
      if (!token || !userStr) {
        window.location.href = "login.html";
        return;
      }

      try {
        currentUser = JSON.parse(userStr);
      } catch (_) {
        window.location.href = "login.html";
        return;
      }

      fetchMyProperties();
      loadBrokerChats();
    }

    async function loadBrokerChats() {
      if (!window.GKAChat) return;
      await GKAChat.mountOlxInbox({
        containerId: 'brokerChatHost',
        token,
        currentUserId: currentUser?.id,
        userRole: 'owner',
        listUrl: `${API_BASE_URL}/broker/conversations`,
        onError: (msg) => showToast(msg)
      });
    }

    async function fetchMyProperties() {
      const target = document.getElementById("listingsContainer");
      target.innerHTML = "";

      try {
        const res = await fetch(`${API_BASE_URL}/broker/properties`, {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });

        if (!res.ok) {
          target.innerHTML = `<p style="grid-column: span 2; color:var(--muted);font-weight:650;text-align:center;">Failed to load publications.</p>`;
          return;
        }

        const props = await res.json();

        if (!props || props.length === 0) {
          target.innerHTML = `<p style="grid-column: span 2; color:var(--muted);font-weight:600;font-size:15px;text-align:center;padding:34px 0;">You haven't listed any managed client properties yet.</p>`;
          return;
        }

        document.getElementById("totalL").textContent = props.length;
        const premCount = props.filter(p => p.listing_type === "premium" || p.is_premium === true).length;
        document.getElementById("premiumL").textContent = premCount;

        props.forEach((p) => {
          const photo = p.media && p.media.length > 0 ? p.media[0].file_url : "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=300";
          const status = p.availability_status || "vacant";

          const card = document.createElement("div");
          card.className = "p-card";
          card.innerHTML = `
            <div class="p-img" style="background-image:url('${photo}')"></div>
            <div class="p-body">
              <div>
                <h4>${p.title}</h4>
                <p>${p.property_type || 'Single Room'} · ${
                  window.GKAPriceDisplay
                    ? GKAPriceDisplay.formatPriceHtml(p, { compact: true })
                    : `₹${parseFloat(p.monthly_rent || 0).toLocaleString()}/mo`
                }</p>
                <div class="p-meta">
                  <span><i class="fa-solid fa-map-pin"></i>${p.city || 'Delhi'}</span>
                  <span><i class="fa-solid fa-star"></i>${p.listing_type === 'premium' ? 'Premium' : 'Standard'}</span>
                </div>
              </div>
              <span class="badge-status ${status}">${status}</span>
            </div>
          `;
          target.appendChild(card);
        });
      } catch (err) {
        console.error("Fetch broker properties error:", err);
        target.innerHTML = `<p style="grid-column: span 2; color:var(--muted);font-weight:650;text-align:center;">Network error.</p>`;
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      if (token) {
        try {
          await fetch(`${API_BASE_URL}/auth/logout`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` }
          });
        } catch (_) {}
      }
      localStorage.removeItem("gka_token");
      localStorage.removeItem("gka_auth_token");
      localStorage.removeItem("gka_user");
      window.location.href = "login.html";
    });

    checkAuth();
  </script>
</body>
</html>
