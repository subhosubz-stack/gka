<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <title>Services Setup — GharKaAdda</title>
  <script src="../JS/gka-route-guard.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="../CSS/gka-app.css?v=2">
  <link rel="stylesheet" href="../CSS/gka-shell.css?v=1">
  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 18%, rgba(122,78,45,.16), transparent 30%),
        radial-gradient(circle at 88% 20%, rgba(122,78,45,.12), transparent 28%),
        linear-gradient(135deg, var(--bg), #fff8ef);
    }
    .svc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 28px;
    }
    .svc-card {
      cursor: pointer;
      padding: 22px;
      border-radius: 28px;
      border: 2px solid var(--line);
      background: rgba(255,255,255,.55);
      transition: .25s;
      text-align: left;
    }
    .svc-card.selected {
      border-color: var(--accent);
      background: rgba(255,255,255,.85);
      box-shadow: 0 20px 60px rgba(63,39,24,.12);
    }
    .svc-card i {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
      font-size: 20px;
    }
    .svc-card h3 {
      margin-top: 16px;
      font-family: Manrope, sans-serif;
      font-size: 20px;
      color: var(--accent-dark);
    }
    .svc-card p {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      font-weight: 600;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
    }
    .back-link {
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.6);
      font-weight: 800;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="gka-noise"></div>
  <main class="gka-page">
    <div class="top-bar">
      <div class="gka-shell-slot" data-auto></div>
      <a href="../tenant-dashboard.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Student hub</a>
      <img src="https://i.postimg.cc/pV527RJK/logo.png" alt="GharKaAdda" style="width:130px;">
    </div>

    <section class="gka-glass" style="padding:36px;margin-top:20px;">
      <div style="padding:14px 18px;border-radius:14px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);margin-bottom:20px;font-weight:700;color:#92400e;">
        <i class="fa-solid fa-clock"></i> Services setup is coming soon.
      </div>
      <p class="gka-kicker">Services</p>
      <h1 class="gka-title">Pick the amenities for your stay</h1>
      <p class="gka-sub" style="max-width:640px;margin-top:10px;">
        Tiffin, laundry, cleaning, and more — verified partners. This section will open in a future release.
      </p>

      <div class="svc-grid" id="svcGrid"></div>

      <button type="button" class="gka-btn gka-btn-primary" id="saveBtn" style="width:100%;margin-top:28px;min-height:52px;">
        <i class="fa-solid fa-check"></i> Save & open dashboard
      </button>
      <p id="msg" class="gka-sub" style="text-align:center;margin-top:14px;"></p>
    </section>
  </main>

  <script src="../config.js?v=2"></script>
  <script src="../JS/gka-notifications.js?v=1"></script>
  <script src="../JS/gka-shell.js?v=1"></script>
  <script>
    const API = window.GKA_CONFIG?.API_BASE_URL || '/api';
    const token = localStorage.getItem('gka_token') || localStorage.getItem('gka_auth_token');
    const selected = new Set();

    async function loadCatalog() {
      const res = await fetch(`${API}/services/catalog`);
      const data = await res.json();
      const grid = document.getElementById('svcGrid');
      grid.innerHTML = (data.services || [])
        .map(
          (s) => `
        <article class="svc-card" data-key="${s.key}">
          <i class="fa-solid ${s.icon}"></i>
          <h3>${s.label}</h3>
          <p>${s.description}</p>
        </article>`
        )
        .join('');

      grid.querySelectorAll('.svc-card').forEach((card) => {
        card.addEventListener('click', () => {
          const key = card.dataset.key;
          if (selected.has(key)) {
            selected.delete(key);
            card.classList.remove('selected');
          } else {
            selected.add(key);
            card.classList.add('selected');
          }
        });
      });
    }

    document.getElementById('saveBtn').onclick = () => {
      document.getElementById('msg').textContent =
        'Services are coming soon. You will be notified when this feature launches.';
    };

    loadCatalog();
  </script>
</body>
</html>
