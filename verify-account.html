<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="JS/gka-route-guard.js"></script>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <link rel="apple-touch-icon" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <title>Verify Account — GharKaAdda</title>
  <link rel="stylesheet" href="CSS/login.css" />
  <link rel="stylesheet" href="CSS/gka-app.css?v=2" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <style>
    .verify-wrap { max-width: 480px; margin: 0 auto; padding: 24px; }
    .otp-input {
      width: 100%; letter-spacing: 0.35em; text-align: center; font-size: 22px;
      font-weight: 800; min-height: 52px; border-radius: 14px;
      border: 1px solid rgba(122,78,45,.25); margin: 12px 0;
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <a href="login.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back</a>

  <main class="auth-page" style="min-height:100vh;align-items:center;">
    <section class="auth-stage" style="width:100%;max-width:520px;">
      <div class="auth-card verify-wrap" style="position:relative;">
        <div class="form-head">
          <h2>Verify your email</h2>
          <p id="verifySubtitle">Enter the code we sent to your inbox.</p>
        </div>

        <div id="panelEmail">
          <p class="gka-sub" style="text-align:left;">Code sent to <strong id="emailTarget">—</strong></p>
          <input class="otp-input" id="emailCode" maxlength="6" placeholder="000000" inputmode="numeric" />
          <button type="button" class="gka-btn gka-btn-primary" style="width:100%;" id="verifyEmailBtn">Verify email</button>
          <button type="button" class="gka-btn gka-btn-ghost" style="width:100%;margin-top:8px;" id="resendEmailBtn">Resend code</button>
        </div>

        <p class="alert" id="verifyAlert"></p>

        <button type="button" class="gka-btn gka-btn-primary" style="width:100%;margin-top:16px;" id="continueBtn" hidden>
          Continue to app <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </section>
  </main>

  <script src="config.js?v=2"></script>
  <script src="JS/gka-auth.js?v=2"></script>
  <script>
    const API = window.GKA_CONFIG?.API_BASE_URL || '/api';
    const token = localStorage.getItem('gka_token') || localStorage.getItem('gka_auth_token');
    const alertEl = document.getElementById('verifyAlert');
    let status = {};

    if (!token) location.href = 'login.html';

    function showAlert(msg, ok) {
      alertEl.textContent = msg;
      alertEl.classList.add('show');
      alertEl.style.color = ok ? 'var(--success)' : '';
    }

    async function api(path, body) {
      const res = await fetch(`${API}/auth${path}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function loadStatus() {
      const res = await fetch(`${API}/auth/verification/status`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      status = await res.json();
      document.getElementById('emailTarget').textContent = status.email || '—';

      if (!status.needs_verification) {
        GKAAuth.redirectAfterAuth(JSON.parse(localStorage.getItem('gka_user') || '{}'));
        return;
      }

      updateContinue();
    }

    function updateContinue() {
      document.getElementById('continueBtn').hidden = !status.email_verified;
    }

    document.getElementById('resendEmailBtn').onclick = async () => {
      try {
        const data = await api('/verification/send-email');
        showAlert(data.message, true);
      } catch (e) { showAlert(e.message); }
    };

    document.getElementById('verifyEmailBtn').onclick = async () => {
      try {
        const data = await api('/verification/verify-email', { code: document.getElementById('emailCode').value });
        status.email_verified = true;
        GKAAuth.saveSession(token, data.user);
        showAlert('Email verified!', true);
        updateContinue();
      } catch (e) { showAlert(e.message); }
    };

    document.getElementById('continueBtn').onclick = () => {
      const user = JSON.parse(localStorage.getItem('gka_user') || '{}');
      GKAAuth.redirectAfterAuth(user);
    };

    loadStatus().then(() => {
      if (!status.email_verified) document.getElementById('resendEmailBtn').click();
    });
  </script>
</body>
</html>
