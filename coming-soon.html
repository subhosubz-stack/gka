<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <title>Coming Soon — GharKaAdda</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: Inter, sans-serif; color: #1c1713;
      background: radial-gradient(circle at 20% 20%, rgba(122,78,45,.2), transparent 40%),
        linear-gradient(135deg, #f7f3ee, #fff8ef);
    }
    .card {
      max-width: 520px; text-align: center; padding: 48px 32px; border-radius: 32px;
      background: rgba(255,255,255,.75); border: 1px solid rgba(122,78,45,.16);
      box-shadow: 0 40px 120px rgba(63,39,24,.14);
      animation: floatIn 0.8s ease forwards;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to { opacity: 1; transform: none; }
    }
    .pulse {
      width: 88px; height: 88px; margin: 0 auto 24px; border-radius: 50%;
      background: linear-gradient(135deg, #7a4e2d, #3d2516);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(122,78,45,.35); }
      50% { transform: scale(1.06); box-shadow: 0 0 0 18px rgba(122,78,45,0); }
    }
    h1 { font-family: Manrope, sans-serif; font-size: 32px; margin-bottom: 12px; }
    p { color: #77695f; line-height: 1.7; font-weight: 600; margin-bottom: 24px; }
    a {
      display: inline-block; padding: 14px 28px; border-radius: 999px;
      background: #7a4e2d; color: #fff; text-decoration: none; font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="pulse"></div>
    <h1>We’re expanding soon</h1>
    <p>GharKaAdda is live in <strong>Punjab, Chandigarh &amp; nearby tricity</strong> (Mohali, Panchkula, Zirakpur). Your location will be added in the next phase.</p>
    <a href="index.html">Back to home</a>
  </div>
</body>
</html>
