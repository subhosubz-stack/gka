<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="JS/gka-route-guard.js"></script>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <link rel="apple-touch-icon" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <title>Roommate Match — GharKaAdda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="CSS/gka-app.css?v=2">
  <link rel="stylesheet" href="CSS/gka-dashboard-nav.css?v=1">
  <link rel="stylesheet" href="CSS/gka-shell.css?v=1">

  <style>
    :root {
      --bg:#f7f3ee;
      --paper:#fffaf4;
      --accent:#7a4e2d;
      --accent-dark:#3d2516;
      --text:#1c1713;
      --muted:#77695f;
      --line:rgba(122,78,45,.16);
      --shadow:0 34px 100px rgba(63,39,24,.16);
      --success:#17803d;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height:100vh;
      font-family:Inter,sans-serif;
      color:var(--text);
      overflow-x:hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(122,78,45,.16), transparent 30%),
        radial-gradient(circle at 88% 20%, rgba(122,78,45,.12), transparent 28%),
        linear-gradient(135deg,var(--bg),#fff8ef);
      -webkit-font-smoothing:antialiased;
    }

    a { color:inherit; text-decoration:none; }
    button { font:inherit; border:0; cursor:pointer; }

    .noise {
      position:fixed;
      inset:0;
      z-index:20;
      opacity:.12;
      pointer-events:none;
      background:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.2'/%3E%3C/svg%3E");
    }

    .page {
      position:relative;
      z-index:2;
      width:min(1180px, calc(100% - 42px));
      min-height:100vh;
      margin:0 auto;
      padding:42px 0;
    }

    .top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:42px;
    }

    .brand img {
      width:150px;
    }

    .back-btn {
      min-height:46px;
      padding:0 18px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.58);
      backdrop-filter:blur(20px);
      color:var(--accent);
      font-weight:900;
      transition:.3s;
      display:inline-flex;
      align-items:center;
      gap:10px;
    }

    .back-btn:hover { transform:translateY(-3px); background:rgba(255,255,255,.8); }

    .split {
      display:grid;
      grid-template-columns:1fr 1.1fr;
      gap:48px;
    }

    .q-card {
      padding:34px;
      border:1px solid var(--line);
      border-radius:38px;
      background:rgba(255,255,255,.7);
      backdrop-filter:blur(28px);
      box-shadow:var(--shadow);
    }

    .q-head { margin-bottom:24px; }
    .q-head h2 { font-family:Manrope,sans-serif; color:var(--accent); font-size:34px; letter-spacing:-.05em; font-weight:800; }
    .q-head p { color:var(--muted); font-size:14.5px; margin-top:8px; font-weight:650; }

    .q-group { margin-top:24px; }
    .q-group h4 { font-family:Manrope,sans-serif; font-size:16px; font-weight:800; margin-bottom:12px; }

    .opts { display:grid; gap:10px; }
    .opt {
      width:100%;
      min-height:54px;
      padding:0 18px;
      border:1px solid rgba(122,78,45,.14);
      border-radius:18px;
      background:rgba(255,255,255,.45);
      text-align:left;
      color:var(--text);
      font-weight:700;
      font-size:14px;
      transition:.25s;
    }

    .opt:hover, .opt.selected {
      background:rgba(122,78,45,.08);
      border-color:var(--accent);
    }

    .opt.selected {
      box-shadow:0 0 0 4px rgba(122,78,45,.08);
    }

    .submit-btn {
      width:100%;
      min-height:56px;
      margin-top:34px;
      border-radius:18px;
      background:var(--accent);
      color:white;
      font-weight:900;
      box-shadow:0 22px 52px rgba(122,78,45,.27);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      transition:.3s;
    }

    .submit-btn:hover {
      transform:translateY(-3px);
      box-shadow:0 28px 62px rgba(122,78,45,.34);
    }

    .matches {
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .matches-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:14px;
    }

    .matches-header h3 { font-family:Manrope,sans-serif; font-size:26px; font-weight:800; }
    .matches-header p { color:var(--muted); font-size:14px; font-weight:650; }

    .match-card {
      width:100%;
      padding:24px;
      border:1px solid var(--line);
      border-radius:28px;
      background:rgba(255,255,255,.62);
      backdrop-filter:blur(20px);
      box-shadow:0 18px 50px rgba(63,39,24,.06);
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:20px;
      text-align:left;
    }

    .m-avatar {
      width:58px;
      height:58px;
      border-radius:50%;
      background:var(--accent);
      color:white;
      display:grid;
      place-items:center;
      font-family:Manrope,sans-serif;
      font-size:20px;
      font-weight:800;
      box-shadow:0 14px 34px rgba(122,78,45,.22);
    }

    .m-info h4 { font-family:Manrope,sans-serif; font-size:18px; font-weight:800; }
    .m-info p { color:var(--muted); font-size:13px; line-height:1.4; margin-top:4px; font-weight:650; }

    .m-badge {
      padding:8px 16px;
      border-radius:999px;
      background:rgba(23,128,61,.1);
      border:1px solid rgba(23,128,61,.2);
      color:var(--success);
      font-weight:900;
      font-size:13.5px;
    }

    .connect-btn {
      padding:8px 16px;
      border-radius:999px;
      background:var(--accent);
      color:white;
      font-weight:900;
      font-size:12.5px;
      box-shadow:0 8px 24px rgba(122,78,45,.2);
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:10px;
      transition:.25s;
    }

    .connect-btn:hover {
      transform:translateY(-2px);
      box-shadow:0 12px 28px rgba(122,78,45,.3);
    }

    .toast {
      position:fixed;
      left:50%;
      bottom:24px;
      z-index:50;
      padding:14px 18px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(18px);
      color:var(--accent);
      font-weight:900;
      box-shadow:0 18px 60px rgba(63,39,24,.15);
      transform:translate(-50%, 80px);
      opacity:0;
      transition:.35s;
    }

    .toast.show {
      transform:translate(-50%,0);
      opacity:1;
    }

    @media (max-width:980px) {
      .split { grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <div class="noise"></div>

  <main class="page">
    <div class="top">
      <a href="index.html" class="brand">
        <img src="https://i.postimg.cc/pV527RJK/logo.png" alt="GharKaAdda">
      </a>

      <div class="gka-shell-slot" data-auto></div>
    </div>

    <nav data-gka-dash-nav></nav>
    <p style="text-align:right;margin-bottom:16px;">
      <a href="tenant-dashboard.html" style="font-weight:800;color:var(--accent);font-size:14px;">
        Skip to dashboard <i class="fa-solid fa-arrow-right"></i>
      </a>
    </p>

    <div class="split">
      <div class="q-card" id="rmWizardHost"></div>

      <div>
        <div class="matches-header">
          <h3>Compatible Roommates</h3>
          <p id="matchCount">0 matches found</p>
        </div>

        <div class="matches" id="matchesList">
          <p style="color:var(--muted);font-weight:600;font-size:15px;text-align:center;padding:42px 0;">
            Apply your habits to load real roommate matches.
          </p>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">Loading questionnaire...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="config.js?v=2"></script>
  <script src="JS/gka-notifications.js?v=1"></script>
  <script src="JS/gka-dashboard-nav.js?v=1"></script>
  <script src="JS/gka-shell.js?v=1"></script>
  <script src="JS/gka-roommate-wizard.js?v=1"></script>
  <script src="JS/gka-payments.js?v=1"></script>
  <script>
    const API_BASE_URL = window.GKA_CONFIG?.API_BASE_URL || "/api";
    const toast = document.getElementById("toast");
    let currentUser = null;
    let token = null;

    const chosenAnswers = {
      sleep: null,
      cleanliness: null,
      diet: null,
      guests: null,
      study: null
    };

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2600);
    }

    async function checkAuth() {
      token = localStorage.getItem("gka_token") || localStorage.getItem("gka_auth_token");
      const userStr = localStorage.getItem("gka_user");
      
      if (!token || !userStr) {
        window.location.href = "login.html";
        return;
      }

      try {
        currentUser = JSON.parse(userStr);
      } catch (_) {
        window.location.href = "login.html";
        return;
      }

      loadPreviousAnswers();
    }

    async function loadPreviousAnswers() {
      showToast("Loading configuration...");

      try {
        const res = await fetch(`${API_BASE_URL}/tenant/preferences`, {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });

        if (!res.ok) return;
        const data = await res.json();

        if (data && data.preference) {
          const pref = data.preference;
          chosenAnswers.sleep = pref.sleep_schedule;
          chosenAnswers.cleanliness = pref.cleanliness_level;
          chosenAnswers.diet = pref.food_preference;
          chosenAnswers.guests = pref.guest_preference;
          chosenAnswers.study = pref.study_preference;

          queryMatches();
        }
      } catch (err) {
        console.error("Load preferences error:", err);
      }
    }

    window.showToast = showToast;

    async function saveAndMatch() {
      document.getElementById("submitLoader")?.style && (document.getElementById("submitLoader").style.display = "inline-block");
      try {
        const res = await fetch(`${API_BASE_URL}/tenant/preferences`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({
            sleep_schedule: chosenAnswers.sleep,
            cleanliness_level: chosenAnswers.cleanliness,
            food_preference: chosenAnswers.diet,
            guest_preference: chosenAnswers.guests,
            study_preference: chosenAnswers.study
          })
        });
        if (!res.ok) {
          const data = await res.json();
          showToast(data.error || "Failed to save preferences");
          return;
        }
        try {
          const meRes = await fetch(`${API_BASE_URL}/auth/me`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (meRes.ok) {
            const meData = await meRes.json();
            if (meData.user) localStorage.setItem("gka_user", JSON.stringify(meData.user));
          }
        } catch (_) {}
        showToast("Preferences saved — loading matches...");
        queryMatches();
      } catch (err) {
        showToast("Network error");
      }
    }

    if (window.GKARoommateWizard) {
      GKARoommateWizard.mount({
        containerId: "rmWizardHost",
        answers: chosenAnswers,
        onComplete: saveAndMatch
      });
    }

    async function queryMatches() {
      try {
        const res = await fetch(`${API_BASE_URL}/tenant/roommate-matches`, {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });

        if (!res.ok) return;
        const peers = await res.json();

        const results = (peers || []).map(p => ({
          user_id: p.user_id,
          name: p.full_name || "GharKaAdda Member",
          email: p.email,
          phone: p.phone,
          contactUnlocked: !!p.contactUnlocked,
          percentage: p.matchPercentage || 70,
          sleep: p.sleep_schedule,
          cleanliness: p.cleanliness_level
        }));

        renderMatches(results);
      } catch (err) {
        console.error("Query matches error:", err);
      }
    }

    function renderMatches(results) {
      const parent = document.getElementById("matchesList");
      const countEl = document.getElementById("matchCount");

      countEl.textContent = `${results.length} roommates found`;

      if (results.length === 0) {
        parent.innerHTML = `
          <p style="color:var(--muted);font-weight:600;font-size:15px;text-align:center;padding:42px 0;">
            No clear roommate compatibility match yet. Expand your choices.
          </p>`;
        return;
      }

      parent.innerHTML = "";

      results.forEach((r) => {
        const initial = r.name.charAt(0);
        const card = document.createElement("div");
        card.className = "match-card";
        card.innerHTML = `
          <div class="m-avatar">${initial}</div>
          <div class="m-info">
            <h4>${r.name}</h4>
            <p><strong>Sleep habit:</strong> ${r.sleep || 'Fluid'} · <strong>Status:</strong> ${r.cleanliness || 'Moderate'}</p>
            ${
              r.contactUnlocked && r.phone
                ? `<a href="https://wa.me/${String(r.phone).replace(/\D/g, "")}" target="_blank" class="connect-btn">
              <i class="fa-brands fa-whatsapp"></i> Chat on WhatsApp
            </a>`
                : `<button type="button" class="connect-btn" data-user-id="${r.user_id}" onclick="unlockRoommateContact('${r.user_id}')">
              <i class="fa-solid fa-lock-open"></i> Unlock contact (paid)
            </button>`
            }
          </div>
          <div class="m-badge">${r.percentage}% match</div>
        `;
        parent.appendChild(card);
      });
    }

    window.unlockRoommateContact = async (targetUserId) => {
      showToast("Opening Razorpay for contact unlock...");
      try {
        const userStr = localStorage.getItem("gka_user");
        const user = userStr ? JSON.parse(userStr) : null;
        await window.GKAPayments.pay({
          purpose: "roommate_unlock",
          target_user_id: targetUserId,
          user,
          onSuccess: () => {
            showToast("Contact unlocked for 30 days.");
            queryMatches();
          },
          onError: (msg) => showToast(msg || "Payment cancelled")
        });
      } catch (err) {
        showToast(err.message || "Unlock failed");
      }
    };

    checkAuth();
  </script>
</body>
</html>
