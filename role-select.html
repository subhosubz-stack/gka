<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="JS/gka-route-guard.js"></script>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <link rel="apple-touch-icon" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <title>Choose Role — GharKaAdda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>
    :root {
      --bg:#f7f3ee;
      --paper:#fffaf4;
      --accent:#7a4e2d;
      --accent-dark:#3d2516;
      --text:#1c1713;
      --muted:#77695f;
      --line:rgba(122,78,45,.16);
      --shadow:0 34px 100px rgba(63,39,24,.16);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height:100vh;
      font-family:Inter,sans-serif;
      color:var(--text);
      overflow-x:hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(122,78,45,.16), transparent 30%),
        radial-gradient(circle at 88% 20%, rgba(122,78,45,.12), transparent 28%),
        linear-gradient(135deg,var(--bg),#fff8ef);
    }

    a { color:inherit; text-decoration:none; }
    button { font:inherit; border:0; cursor:pointer; }

    .noise {
      position:fixed;
      inset:0;
      z-index:20;
      opacity:.12;
      pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
    }

    .bg-world {
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      overflow:hidden;
      perspective:1400px;
    }

    .ring {
      position:absolute;
      left:50%;
      top:50%;
      border:1px solid rgba(122,78,45,.14);
      border-radius:50%;
      transform-style:preserve-3d;
    }

    .ring.one {
      width:760px;
      height:760px;
      animation:spinOne 28s linear infinite;
    }

    .ring.two {
      width:520px;
      height:520px;
      animation:spinTwo 22s linear infinite;
    }

    .ring.three {
      width:300px;
      height:300px;
      animation:spinThree 18s linear infinite;
    }

    @keyframes spinOne {
      from { transform:translate(-50%,-50%) rotateX(68deg) rotateZ(0deg); }
      to { transform:translate(-50%,-50%) rotateX(68deg) rotateZ(360deg); }
    }

    @keyframes spinTwo {
      from { transform:translate(-50%,-50%) rotateX(74deg) rotateY(18deg) rotateZ(0deg); }
      to { transform:translate(-50%,-50%) rotateX(74deg) rotateY(18deg) rotateZ(-360deg); }
    }

    @keyframes spinThree {
      from { transform:translate(-50%,-50%) rotateX(62deg) rotateY(-20deg) rotateZ(0deg); }
      to { transform:translate(-50%,-50%) rotateX(62deg) rotateY(-20deg) rotateZ(360deg); }
    }

    .orb {
      position:absolute;
      border-radius:50%;
      background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(122,78,45,.42) 42%, rgba(122,78,45,.08) 72%);
      box-shadow:0 40px 90px rgba(122,78,45,.18);
      animation:float 5s ease-in-out infinite;
    }

    .orb.a { width:180px; height:180px; right:8%; top:14%; }
    .orb.b { width:96px; height:96px; left:8%; bottom:15%; animation-delay:-2s; }

    @keyframes float {
      0%,100% { transform:translateY(0) scale(1); }
      50% { transform:translateY(-24px) scale(1.04); }
    }

    .page {
      position:relative;
      z-index:2;
      width:min(1180px, calc(100% - 42px));
      min-height:100vh;
      margin:0 auto;
      padding:42px 0;
      display:grid;
      align-items:center;
    }

    .top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:42px;
    }

    .brand img {
      width:150px;
      height:auto;
    }

    .logout {
      min-height:46px;
      padding:0 18px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.56);
      backdrop-filter:blur(18px);
      color:var(--accent);
      font-weight:900;
      transition:.3s;
    }

    .logout:hover { transform:translateY(-3px); background:rgba(255,255,255,.8); }

    .hero {
      text-align:center;
      margin-bottom:48px;
    }

    .kicker {
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:var(--accent);
      font-size:13px;
      font-weight:900;
      letter-spacing:.15em;
      text-transform:uppercase;
      margin-bottom:20px;
    }

    .kicker::before {
      content:"";
      width:38px;
      height:2px;
      border-radius:99px;
      background:var(--accent);
    }

    h1 {
      max-width:950px;
      margin:0 auto;
      font-family:Manrope,Inter,sans-serif;
      font-size:clamp(42px,7vw,92px);
      line-height:.94;
      letter-spacing:-.075em;
      font-weight:800;
    }

    h1 span { color:var(--accent); }

    .sub {
      max-width:650px;
      margin:24px auto 0;
      color:var(--muted);
      font-size:18px;
      line-height:1.7;
      font-weight:600;
    }

    .roles {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
      perspective:1200px;
    }

    .role {
      position:relative;
      min-height:330px;
      padding:30px;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:34px;
      background:linear-gradient(145deg,rgba(255,255,255,.7),rgba(255,255,255,.32));
      backdrop-filter:blur(24px);
      box-shadow:0 24px 80px rgba(63,39,24,.09);
      text-align:left;
      transform-style:preserve-3d;
      transition:transform .35s ease, box-shadow .35s ease, border .35s ease;
      width: 100%;
    }

    .role::before {
      content:"";
      position:absolute;
      width:220px;
      height:220px;
      right:-100px;
      top:-100px;
      border-radius:50%;
      background:rgba(122,78,45,.12);
      transition:.45s;
    }

    .role:hover {
      transform:translateY(-10px) rotateX(4deg);
      border-color:rgba(122,78,45,.36);
      box-shadow:0 34px 110px rgba(63,39,24,.18);
    }

    .role:hover::before { transform:scale(1.35); }

    .role i {
      position:relative;
      width:58px;
      height:58px;
      display:grid;
      place-items:center;
      border-radius:20px;
      background:var(--accent);
      color:white;
      font-size:20px;
      box-shadow:0 18px 42px rgba(122,78,45,.28);
    }

    .role h3 {
      position:relative;
      margin-top:86px;
      font-family:Manrope,Inter,sans-serif;
      font-size:28px;
      line-height:1;
      letter-spacing:-.06em;
    }

    .role p {
      position:relative;
      margin-top:14px;
      color:var(--muted);
      font-size:14.5px;
      line-height:1.7;
      font-weight:650;
    }

    .role strong {
      position:absolute;
      left:30px;
      bottom:26px;
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:var(--accent);
      font-size:14px;
      font-weight:900;
    }

    .role strong i {
      width:auto;
      height:auto;
      display:inline;
      background:none;
      color:inherit;
      box-shadow:none;
      font-size:14px;
    }

    .toast {
      position:fixed;
      left:50%;
      bottom:24px;
      z-index:50;
      padding:14px 18px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(18px);
      color:var(--accent);
      font-weight:900;
      box-shadow:0 18px 60px rgba(63,39,24,.15);
      transform:translate(-50%, 80px);
      opacity:0;
      transition:.35s;
    }

    .toast.show {
      transform:translate(-50%,0);
      opacity:1;
    }

    @media (max-width:1000px) {
      .roles { grid-template-columns:repeat(2,1fr); }
    }

    @media (max-width:620px) {
      .page { width:min(100% - 24px,1180px); padding:24px 0; }
      .top { align-items:flex-start; flex-direction:column; gap:18px; }
      .roles { grid-template-columns:1fr; }
      .role { min-height:270px; }
      .role h3 { margin-top:58px; }
      .orb,.ring { opacity:.45; }
    }
  </style>
</head>

<body>
  <div class="noise"></div>

  <div class="bg-world">
    <div class="ring one"></div>
    <div class="ring two"></div>
    <div class="ring three"></div>
    <div class="orb a"></div>
    <div class="orb b"></div>
  </div>

  <main class="page">
    <div>
      <div class="top">
        <a href="index.html" class="brand">
          <img src="https://i.postimg.cc/pV527RJK/logo.png" alt="GharKaAdda">
        </a>

        <button class="logout" id="logoutBtn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          Logout
        </button>
      </div>

      <section class="hero">
        <div class="kicker">Choose your journey</div>
        <h1>As whom are you joining <span>GharKaAdda?</span></h1>
        <p class="sub">
          Your role decides your onboarding flow and final dashboard experience.
        </p>
      </section>

      <section class="roles">
        <button class="role" data-role="tenant" data-target="tenant-match.html">
          <i class="fa-solid fa-user-graduate"></i>
          <h3>Tenant / Student</h3>
          <p>Find rooms, set lifestyle preferences, match roommates, and unlock verified property contacts.</p>
          <strong>Continue <i class="fa-solid fa-arrow-right"></i></strong>
        </button>

        <button class="role" data-role="owner" data-target="owner-onboarding.html">
          <i class="fa-solid fa-house-user"></i>
          <h3>Owner</h3>
          <p>List your property with photos, rent details, amenities, rules, and verification flow.</p>
          <strong>Continue <i class="fa-solid fa-arrow-right"></i></strong>
        </button>

        <button class="role" data-role="broker" data-target="broker-onboarding.html">
          <i class="fa-solid fa-user-tie"></i>
          <h3>Broker</h3>
          <p>Simple broker verification. Admin approval required before full access.</p>
          <strong>Continue <i class="fa-solid fa-arrow-right"></i></strong>
        </button>
      </section>
    </div>
  </main>

  <div class="toast" id="toast">Saving role...</div>  <script src="config.js?v=2"></script>
  <script>
    const API_BASE_URL = window.GKA_CONFIG?.API_BASE_URL || "/api";
    const toast = document.getElementById("toast");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function getAuthSession() {
      const token = localStorage.getItem("gka_token") || localStorage.getItem("gka_auth_token");
      const userStr = localStorage.getItem("gka_user");
      let user = null;
      try {
        if (userStr) user = JSON.parse(userStr);
      } catch (_) {}
      return { token, user };
    }

    function requireUser() {
      const { token, user } = getAuthSession();
      if (!token || !user) {
        localStorage.removeItem("gka_token");
        localStorage.removeItem("gka_auth_token");
        localStorage.removeItem("gka_user");
        window.location.href = "login.html";
        return null;
      }
      if (user.role === "admin") {
        if (user.admin_tier === "property") {
          window.location.href = "property-admin/index.html";
        } else if (user.admin_tier === "super") {
          window.location.href = "super-admin/index.html";
        } else {
          window.location.href = "admin-dashboard.html";
        }
        return null;
      }
      if (user.needs_verification) {
        window.location.href = "verify-account.html";
        return null;
      }
      return { token, user };
    }

    document.querySelectorAll(".role").forEach((card) => {
      card.addEventListener("mousemove", (event) => {
        const rect = card.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        const rotateY = ((x / rect.width) - 0.5) * 8;
        const rotateX = -((y / rect.height) - 0.5) * 8;

        card.style.transform = `translateY(-10px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      });

      card.addEventListener("mouseleave", () => {
        card.style.transform = "";
      });

      card.addEventListener("click", async () => {
        const session = requireUser();
        if (!session) return;

        const role = card.dataset.role;
        const target = card.dataset.target;

        showToast("Saving role choice...");

        try {
          const res = await fetch(`${API_BASE_URL}/auth/select-role`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${session.token}`
            },
            body: JSON.stringify({ role })
          });

          const data = await res.json();

          if (!res.ok) {
            showToast(data.error || "Failed to update user role");
            return;
          }

          let freshUser = data.user;
          try {
            const meRes = await fetch(`${API_BASE_URL}/auth/me`, {
              headers: { Authorization: `Bearer ${session.token}` }
            });
            if (meRes.ok) {
              const meData = await meRes.json();
              if (meData.user) freshUser = meData.user;
            }
          } catch (_) {}
          localStorage.setItem("gka_user", JSON.stringify(freshUser));
          showToast("Role saved successfully. Opening next step...");

          setTimeout(() => {
            window.location.href = target;
          }, 700);

        } catch (err) {
          console.error("Save role error:", err);
          showToast("Network error. Please try again.");
        }
      });
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      const session = getAuthSession();
      if (session.token) {
        try {
          await fetch(`${API_BASE_URL}/auth/logout`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${session.token}` }
          });
        } catch (_) {}
      }
      localStorage.removeItem("gka_token");
      localStorage.removeItem("gka_auth_token");
      localStorage.removeItem("gka_user");
      window.location.href = "login.html";
    });

    requireUser();
  </script>
</body>
</html>
