<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="JS/gka-route-guard.js"></script>
  <link rel="icon" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <title>My Wishlist — GharKaAdda</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="CSS/gka-app.css?v=2" />
  <link rel="stylesheet" href="CSS/gka-dashboard-nav.css?v=1" />
  <link rel="stylesheet" href="CSS/gka-price-display.css?v=1" />
  <link rel="stylesheet" href="CSS/gka-shell.css?v=1" />
  <style>
    body { min-height: 100vh; background: linear-gradient(135deg, var(--bg), #fff8ef); font-family: Inter, sans-serif; color: var(--text); }
    .top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
    .back-btn { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.6); font-weight: 800; color: var(--accent); display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
    .wish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 20px; }
    .wish-card { padding: 20px; border-radius: 24px; border: 1px solid var(--line); background: rgba(255,255,255,.7); }
    .wish-card h3 { font-family: Manrope, sans-serif; color: var(--accent); font-size: clamp(18px, 4vw, 20px); }
    .wish-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .wish-actions button, .wish-actions a { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-weight: 800; font-size: 12px; color: var(--accent); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="gka-noise"></div>
  <main class="gka-page">
    <div class="top">
      <div class="gka-shell-slot" data-auto></div>
    </div>
    <nav data-gka-dash-nav></nav>
    <h1 class="gka-title">My wishlist</h1>
    <p class="gka-sub" style="margin-bottom:24px;">Properties you saved — open a listing to chat with the owner.</p>
    <div class="wish-grid" id="wishGrid"></div>
    <p class="gka-sub" id="emptyMsg" hidden>No saved properties yet. <a href="tenant-search-dashboard.html" style="color:var(--accent);font-weight:800;">Browse listings</a></p>
  </main>
  <script src="config.js"></script>
  <script src="JS/gka-notifications.js?v=1"></script>
  <script src="JS/gka-price-display.js?v=1"></script>
  <script src="JS/gka-dashboard-nav.js?v=1"></script>
  <script src="JS/gka-shell.js?v=2"></script>
  <script>
    const API = window.GKA_CONFIG?.API_BASE_URL || '/api';
    const token = localStorage.getItem('gka_token') || localStorage.getItem('gka_auth_token');
    const seen = new Set();

    async function load() {
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      const res = await fetch(`${API}/tenant/favorites`, { headers: { Authorization: `Bearer ${token}` } });
      const rows = await res.json();
      const grid = document.getElementById('wishGrid');
      grid.innerHTML = '';
      seen.clear();

      const unique = (Array.isArray(rows) ? rows : []).filter((p) => {
        if (!p?.id || seen.has(p.id)) return false;
        seen.add(p.id);
        return true;
      });

      if (!unique.length) {
        document.getElementById('emptyMsg').hidden = false;
        return;
      }
      document.getElementById('emptyMsg').hidden = true;

      grid.innerHTML = unique.map(p => `
        <article class="wish-card">
          <h3>${p.title}</h3>
          <p class="gka-sub">${p.city || ''} · ${p.nearest_college || ''}</p>
          <p class="gka-sub">${
            window.GKAPriceDisplay
              ? GKAPriceDisplay.formatPriceHtml(p)
              : `<strong>₹${parseFloat(p.monthly_rent||0).toLocaleString()}</strong>/mo`
          }</p>
          <div class="wish-actions">
            <a href="tenant-search-dashboard.html?property=${p.id}"><i class="fa-solid fa-eye"></i> Open listing</a>
            <a href="tenant-chats.html?property=${p.id}"><i class="fa-solid fa-comments"></i> Message</a>
            <button type="button" data-remove="${p.id}"><i class="fa-solid fa-heart-crack"></i> Remove</button>
          </div>
        </article>`).join('');

      grid.querySelectorAll('[data-remove]').forEach(btn => {
        btn.onclick = async () => {
          await fetch(`${API}/properties/${btn.dataset.remove}/favorite`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
          load();
        };
      });
    }
    load();
  </script>
</body>
</html>
