<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="JS/gka-route-guard.js"></script>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <link rel="apple-touch-icon" href="https://i.postimg.cc/Nj6b1m6s/logo.png" />
  <title>Admin Audit Center — GharKaAdda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>
    :root {
      --bg:#f7f3ee;
      --paper:#fffaf4;
      --accent:#7a4e2d;
      --accent-dark:#3d2516;
      --text:#1c1713;
      --muted:#77695f;
      --line:rgba(122,78,45,.16);
      --shadow:0 34px 100px rgba(63,39,24,.16);
      --success:#17803d;
      --danger:#d93025;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height:100vh;
      font-family:Inter,sans-serif;
      color:var(--text);
      overflow-x:hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(122,78,45,.16), transparent 30%),
        radial-gradient(circle at 88% 20%, rgba(122,78,45,.12), transparent 28%),
        linear-gradient(135deg,var(--bg),#fff8ef);
    }

    a { color:inherit; text-decoration:none; }
    button { font:inherit; border:0; cursor:pointer; }

    .noise {
      position:fixed;
      inset:0;
      z-index:20;
      opacity:.12;
      pointer-events:none;
      background:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.2'/%3E%3C/svg%3E");
    }

    .page {
      position:relative;
      z-index:2;
      width:min(1240px, calc(100% - 42px));
      min-height:100vh;
      margin:0 auto;
      padding:42px 0;
    }

    .top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:42px;
    }

    .brand img {
      width:150px;
    }

    .logout {
      min-height:46px;
      padding:0 18px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.58);
      backdrop-filter:blur(20px);
      color:var(--accent);
      font-weight:900;
      transition:.3s;
    }

    .logout:hover { transform:translateY(-3px); background:rgba(255,255,255,.8); }

    .grid-admin {
      display:grid;
      grid-template-columns:1fr 1.1fr;
      gap:34px;
    }

    .audit-block {
      padding:30px;
      border:1px solid var(--line);
      border-radius:34px;
      background:rgba(255,255,255,.68);
      backdrop-filter:blur(24px);
      box-shadow:var(--shadow);
      margin-bottom:34px;
    }

    .audit-block h2 { font-family:Manrope,sans-serif; color:var(--accent); font-size:26px; font-weight:800; margin-bottom:18px; }

    .audit-list {
      display:grid;
      gap:14px;
      max-height:450px;
      overflow:auto;
      padding-right:4px;
    }

    .audit-list::-webkit-scrollbar { width:6px; }
    .audit-list::-webkit-scrollbar-thumb { background:rgba(122,78,45,.2); border-radius:99px; }

    .audit-card {
      padding:18px;
      border:1px solid var(--line);
      border-radius:20px;
      background:rgba(255,255,255,.45);
      text-align:left;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .audit-header { display:flex; justify-content:space-between; align-items:center; }
    .audit-header h4 { font-family:Manrope,sans-serif; font-size:16px; font-weight:800; }
    .audit-header span { font-size:11.5px; font-weight:900; text-transform:uppercase; color:var(--accent); }

    .audit-meta { font-size:12.5px; color:var(--muted); font-weight:700; border-top:1px solid var(--line); padding-top:10px; }

    .audit-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
    .audit-btns button {
      height:36px;
      border-radius:8px;
      font-weight:900;
      font-size:12px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      transition:.2s;
    }

    .approve-btn { background:var(--accent); color:white; }
    .approve-btn:hover { transform:translateY(-2px); }

    .toggle-tier-btn { border:1px solid var(--line); background:white; color:var(--accent-dark); }
    .toggle-tier-btn:hover { background:rgba(122,78,45,.06); }

    .toast {
      position:fixed;
      left:50%;
      bottom:24px;
      z-index:900;
      padding:14px 18px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(18px);
      color:var(--accent);
      font-weight:900;
      box-shadow:0 18px 60px rgba(63,39,24,.15);
      transform:translate(-50%, 80px);
      opacity:0;
      transition:.35s;
    }

    .toast.show {
      transform:translate(-50%,0);
      opacity:1;
    }

    @media (max-width:900px) {
      .grid-admin { grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <div class="noise"></div>

  <main class="page">
    <div class="top">
      <a href="index.html" class="brand">
        <img src="https://i.postimg.cc/pV527RJK/logo.png" alt="GharKaAdda">
      </a>

      <button class="logout" id="logoutBtn">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
      </button>
    </div>

    <div class="grid-admin">
      <div>
        <!-- Verify Profiles Panel -->
        <div class="audit-block">
          <h2>Profiles approval desk</h2>
          <div class="audit-list" id="profilesApprovalContainer">
            <p style="color:var(--muted);font-weight:600;font-size:14.5px;text-align:center;padding:28px 0;">Loading profiles registration queue...</p>
          </div>
        </div>

        <!-- Verify Payments Panel -->
        <div class="audit-block">
          <h2>Platform transaction audits</h2>
          <div class="audit-list" id="paymentsApprovalContainer">
            <p style="color:var(--muted);font-weight:600;font-size:14.5px;text-align:center;padding:28px 0;">No active system payouts logged yet.</p>
          </div>
        </div>
      </div>

      <div>
        <div class="audit-block">
          <h2>Platform pricing (PRD)</h2>
          <div id="settingsForm" style="display:grid;gap:10px;font-size:14px;"></div>
          <button class="approve-btn" id="saveSettingsBtn" style="margin-top:12px;">Save pricing settings</button>
        </div>

        <div class="audit-block">
          <h2>Tiffin commission tracker</h2>
          <div id="tiffinSummary" style="font-weight:700;margin-bottom:10px;color:var(--accent);"></div>
          <div class="audit-list" id="tiffinDealsContainer">
            <p style="color:var(--muted);font-weight:600;font-size:14px;text-align:center;padding:20px 0;">Loading deals...</p>
          </div>
        </div>

        <!-- Verify Properties Tier -->
        <div class="audit-block">
          <h2>Listing placement tiers</h2>
          <div class="audit-list" id="propertiesContainer">
            <p style="color:var(--muted);font-weight:600;font-size:14.5px;text-align:center;padding:28px 0;">Loading properties list...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">Loading admin panel...</div>

  <script src="config.js?v=2"></script>
  <script>
    const API_BASE_URL = window.GKA_CONFIG?.API_BASE_URL || "/api";
    const toast = document.getElementById("toast");
    let currentUser = null;
    let token = null;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2600);
    }

    async function checkAuth() {
      token = localStorage.getItem("gka_token") || localStorage.getItem("gka_auth_token");
      const userStr = localStorage.getItem("gka_user");
      
      if (!token || !userStr) {
        window.location.href = "login.html";
        return;
      }

      try {
        currentUser = JSON.parse(userStr);
      } catch (_) {
        window.location.href = "login.html";
        return;
      }

      fetchAuditStreams();
    }

    const SETTING_FIELDS = [
      { key: "contact_unlock_standard_inr", label: "Contact unlock (standard) ₹" },
      { key: "contact_unlock_premium_inr", label: "Contact unlock (premium) ₹" },
      { key: "contact_unlock_days", label: "Contact unlock validity (days)" },
      { key: "lock_request_hide_days", label: "Lock hide duration (days)" },
      { key: "visibility_boost_inr", label: "Visibility boost ₹" },
      { key: "roommate_unlock_inr", label: "Roommate unlock ₹" },
      { key: "tiffin_commission_percent", label: "Tiffin commission %" }
    ];

    let platformSettings = {};

    function fetchAuditStreams() {
      fetchProfilesQueue();
      fetchPaymentsQueue();
      fetchPropertiesList();
      fetchPlatformSettings();
      fetchTiffinDeals();
    }

    async function fetchPlatformSettings() {
      const form = document.getElementById("settingsForm");
      if (!form) return;
      try {
        const res = await fetch(`${API_BASE_URL}/admin/settings`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) return;
        const data = await res.json();
        platformSettings = data.settings || {};
        form.innerHTML = SETTING_FIELDS.map((f) => `
          <label style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
            <span>${f.label}</span>
            <input data-key="${f.key}" type="text" value="${platformSettings[f.key] ?? ""}" style="max-width:120px;padding:8px;border-radius:8px;border:1px solid var(--line);">
          </label>
        `).join("");
      } catch (err) {
        console.error("Settings load error:", err);
      }
    }

    document.getElementById("saveSettingsBtn")?.addEventListener("click", async () => {
      const inputs = document.querySelectorAll("#settingsForm input[data-key]");
      const settings = {};
      inputs.forEach((inp) => { settings[inp.dataset.key] = inp.value; });
      try {
        const res = await fetch(`${API_BASE_URL}/admin/settings`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ settings })
        });
        if (!res.ok) {
          showToast("Failed to save settings");
          return;
        }
        showToast("Platform pricing updated.");
        fetchPlatformSettings();
      } catch (err) {
        showToast("Network error saving settings.");
      }
    });

    async function fetchTiffinDeals() {
      const target = document.getElementById("tiffinDealsContainer");
      const summary = document.getElementById("tiffinSummary");
      if (!target) return;
      try {
        const res = await fetch(`${API_BASE_URL}/admin/tiffin-deals`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) return;
        const data = await res.json();
        if (summary) {
          summary.textContent = `Total commission: ₹${parseFloat(data.summary?.total_commission || 0).toLocaleString()} · ${data.summary?.deal_count || 0} deals`;
        }
        const deals = data.deals || [];
        if (!deals.length) {
          target.innerHTML = `<p style="color:var(--muted);text-align:center;padding:16px 0;">No tiffin opt-ins yet.</p>`;
          return;
        }
        target.innerHTML = "";
        deals.forEach((d) => {
          const card = document.createElement("div");
          card.className = "audit-card";
          card.innerHTML = `
            <div class="audit-header"><h4>${d.provider_name}</h4><span>₹${parseFloat(d.commission_value || 0)}</span></div>
            <div class="audit-meta">${d.student_name || "Student"} · ${d.plan_name || "Plan"} · ₹${parseFloat(d.deal_value || 0).toLocaleString()}</div>
          `;
          target.appendChild(card);
        });
      } catch (err) {
        console.error("Tiffin deals error:", err);
      }
    }

    async function fetchProfilesQueue() {
      const target = document.getElementById("profilesApprovalContainer");
      target.innerHTML = "";

      try {
        const res = await fetch(`${API_BASE_URL}/admin/profiles`, {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });

        if (!res.ok) {
          target.innerHTML = `<p style="color:var(--muted);font-weight:650;">Error loading profiles.</p>`;
          return;
        }

        const profiles = await res.json();
        const pending = (profiles || []).filter(p => p.verification_status === "admin_verification_required");

        if (pending.length === 0) {
          target.innerHTML = `<p style="color:var(--muted);font-weight:600;font-size:14px;text-align:center;padding:28px 0;">No profiles with pending verification requests.</p>`;
          return;
        }

        pending.forEach((p) => {
          const meta = p.metadata || {};
          const extraInfo = meta.agencyName ? `Agency: ${meta.agencyName} | RERA: ${meta.reraRegisterCode}` : 'Basic registration';

          const card = document.createElement("div");
          card.className = "audit-card";
          card.innerHTML = `
            <div class="audit-header">
              <h4>${p.full_name}</h4>
              <span>Role: ${p.role?.toUpperCase()}</span>
            </div>
            <div class="audit-meta">
              Email: ${p.email || 'N/A'}<br>
              Phone: ${p.phone || 'N/A'}<br>
              Verification Scope: <strong>${extraInfo}</strong>
            </div>
            <div class="audit-btns">
              <button class="approve-btn" onclick="verifyProfile('${p.id}', 'verified')">Approve Profile</button>
              <button class="toggle-tier-btn" onclick="verifyProfile('${p.id}', 'rejected')">Reject</button>
            </div>
          `;
          target.appendChild(card);
        });
      } catch (err) {
        console.error("Fetch profiles list error:", err);
        target.innerHTML = `<p style="color:var(--muted);font-weight:650;">Network error.</p>`;
      }
    }

    async function fetchPaymentsQueue() {
      const target = document.getElementById("paymentsApprovalContainer");
      target.innerHTML = "";

      try {
        const res = await fetch(`${API_BASE_URL}/admin/payments`, {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });

        if (!res.ok) return;

        const payments = await res.json();
        const pending = (payments || []).filter(p => p.status === "pending" || p.status === "created");

        if (pending.length === 0) {
          target.innerHTML = `<p style="color:var(--muted);font-weight:600;font-size:14px;text-align:center;padding:28px 0;">No transaction payout audits queueing.</p>`;
          return;
        }

        pending.forEach((p) => {
          const card = document.createElement("div");
          card.className = "audit-card";
          card.innerHTML = `
            <div class="audit-header">
              <h4>Payout check for ₹${parseFloat(p.amount || 0).toLocaleString()}</h4>
              <span>${p.status?.toUpperCase()}</span>
            </div>
            <div class="audit-meta">
              Resident: <strong>${p.tenant_name || 'Resident'}</strong><br>
              Reference/Provider Order ID: <strong>${p.provider_payment_id || p.provider_order_id || 'N/A'}</strong>
            </div>
            <div class="audit-btns">
              <button class="approve-btn" onclick="verifyPayment('${p.id}', 'paid')">Accept payout</button>
              <button class="toggle-tier-btn" onclick="verifyPayment('${p.id}', 'failed')">Decline</button>
            </div>
          `;
          target.appendChild(card);
        });
      } catch (err) {
        console.error("Fetch admin payments queue error:", err);
      }
    }

    async function fetchPropertiesList() {
      const target = document.getElementById("propertiesContainer");
      target.innerHTML = "";

      try {
        const res = await fetch(`${API_BASE_URL}/admin/properties`, {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });

        if (!res.ok) return;

        const properties = await res.json();

        if (!properties || properties.length === 0) {
          target.innerHTML = `<p style="color:var(--muted);font-weight:600;font-size:14px;text-align:center;padding:28px 0;">No active list rooms inside system database.</p>`;
          return;
        }

        properties.forEach((p) => {
          const isPremium = p.listing_type === "premium" || p.is_premium === true;

          const card = document.createElement("div");
          card.className = "audit-card";
          card.innerHTML = `
            <div class="audit-header">
              <h4>${p.title}</h4>
              <span>${p.availability_status?.toUpperCase()}</span>
            </div>
            <div class="audit-meta">
              Region locality: <strong>${p.city || 'Delhi'}</strong><br>
              Monthly rent value: <strong>₹${parseFloat(p.monthly_rent || 0).toLocaleString()}</strong><br>
              Verified Placement Tier: <strong style="color:var(--accent);">${isPremium ? 'Premium placement tier' : 'Standard placement tier'}</strong>
            </div>
            <div class="audit-btns" style="grid-template-columns:1fr;">
              <button class="toggle-tier-btn" onclick="togglePlacementTier('${p.id}', ${isPremium})">
                <i class="fa-solid fa-arrows-spin"></i> Toggle Placement Tier
              </button>
            </div>
          `;
          target.appendChild(card);
        });
      } catch (err) {
        console.error("Fetch admin listings error:", err);
      }
    }

    window.verifyProfile = async (id, status) => {
      showToast("Updating profile registration...");

      try {
        const res = await fetch(`${API_BASE_URL}/admin/profiles/${id}/verify`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ status })
        });

        const data = await res.json();

        if (!res.ok) {
          showToast(data.error || "Failed to update profile verification status");
          return;
        }

        showToast("Profile validation updated successfully.");
        fetchAuditStreams();
      } catch (err) {
        console.error("verifyProfile error:", err);
        showToast("Error validation profile.");
      }
    };

    window.verifyPayment = async (id, status) => {
      showToast("Verifying payment transcript...");

      try {
        const res = await fetch(`${API_BASE_URL}/admin/payments/${id}/verify`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ status })
        });

        const data = await res.json();

        if (!res.ok) {
          showToast(data.error || "Failed to update invoice");
          return;
        }

        showToast(`Payment reference updated to ${status}.`);
        fetchAuditStreams();
      } catch (err) {
        console.error("verifyPayment error:", err);
        showToast("Error checking transaction.");
      }
    };

    window.togglePlacementTier = async (id, currentIsPremium) => {
      showToast("Updating room tier allocation...");

      try {
        const res = await fetch(`${API_BASE_URL}/admin/properties/${id}/toggle-tier`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ is_premium: !currentIsPremium })
        });

        const data = await res.json();

        if (!res.ok) {
          showToast(data.error || "Failed to switch placement tier");
          return;
        }

        showToast("Room listing placement tier toggled.");
        fetchAuditStreams();
      } catch (err) {
        console.error("togglePlacementTier error:", err);
        showToast("Error updating room tier allocation.");
      }
    };

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      if (token) {
        try {
          await fetch(`${API_BASE_URL}/auth/logout`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` }
          });
        } catch (_) {}
      }
      localStorage.removeItem("gka_token");
      localStorage.removeItem("gka_auth_token");
      localStorage.removeItem("gka_user");
      window.location.href = "login.html";
    });

    checkAuth();
  </script>
</body>
</html>
